name: Build NABA unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-26

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Select compatible Xcode
        run: |
          set -e

          for xcode_path in \
            "/Applications/Xcode_26.6.app/Contents/Developer" \
            "/Applications/Xcode_26.5.app/Contents/Developer" \
            "/Applications/Xcode_26.4.1.app/Contents/Developer" \
            "/Applications/Xcode_26.4.app/Contents/Developer" \
            "/Applications/Xcode_26.3.app/Contents/Developer" \
            "/Applications/Xcode_26.2.app/Contents/Developer" \
            "/Applications/Xcode_26.1.app/Contents/Developer" \
            "/Applications/Xcode.app/Contents/Developer"
          do
            if [ -d "$xcode_path" ]; then
              sudo xcode-select -s "$xcode_path"
              break
            fi
          done

          echo "Selected Xcode:"
          xcodebuild -version

          echo "Selected Swift:"
          swift --version

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.6.2 --activate

      - name: Install JavaScript dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods --no-document
          pod --version

      - name: Install CocoaPods dependencies
        continue-on-error: true
        run: |
          set -o pipefail
          cd ios
          pod install --repo-update --verbose 2>&1 | tee ../pod-install.log

      - name: Upload CocoaPods log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NABA-cocoapods-log
          path: pod-install.log
          if-no-files-found: warn

      - name: Stop if CocoaPods failed
        run: |
          test -f ios/Pods/Manifest.lock

      - name: Build unsigned IPA
        continue-on-error: true
        run: |
          set -o pipefail
          bash scripts/build-unsigned-ipa.sh 2>&1 | tee xcodebuild.log

      - name: Upload Xcode build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NABA-xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: warn

      - name: Stop if IPA build failed
        run: |
          test -f build/NABA-unsigned.ipa

      - name: Verify unsigned IPA
        run: |
          test -f build/NABA-unsigned.ipa
          ls -lh build/NABA-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: NABA-unsigned-IPA
          path: build/NABA-unsigned.ipa
          if-no-files-found: error
